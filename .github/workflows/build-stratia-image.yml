name: Build & push Stratia Twenty image

# STRATIA: This workflow is a StratIA fork addition, not upstream Twenty.
# It builds a Docker image of the Twenty fork (including all stratia/ extensions)
# and pushes it to GitHub Container Registry so Railway can pull it.
#
# Target: the `twenty` stage of packages/twenty-docker/twenty/Dockerfile — the
# same stage upstream publishes as twentycrm/twenty on Docker Hub.
#
# Monthly upstream rebase workflow:
#   1. git fetch upstream
#   2. git rebase upstream/main onto stratia/main
#   3. Resolve conflicts (grep for # STRATIA: markers)
#   4. git push origin stratia/main
#   5. This workflow triggers automatically, pushes fresh image
#   6. Railway services redeploy on image update

on:
  push:
    branches:
      - stratia/main
    paths:
      - 'packages/twenty-server/**'
      - 'packages/twenty-front/**'
      - 'packages/twenty-shared/**'
      - 'packages/twenty-ui/**'
      - 'packages/twenty-emails/**'
      - 'packages/twenty-docker/twenty/Dockerfile'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/build-stratia-image.yml'
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Optional suffix for the image tag (default = stratia-main)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/twenty-stratia
  # Default build arg for the frontend. Override via workflow_dispatch if needed.
  REACT_APP_SERVER_BASE_URL: https://crm.helpr.sale

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch || github.ref_name == 'stratia/main'}}
            type=raw,value=stratia-main,enable=${{ github.ref_name == 'stratia/main' }}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ github.event.inputs.tag_suffix }},enable=${{ github.event.inputs.tag_suffix != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REACT_APP_SERVER_BASE_URL=${{ env.REACT_APP_SERVER_BASE_URL }}
            APP_VERSION=stratia-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "## Stratia Twenty image built" >> $GITHUB_STEP_SUMMARY
          echo "Registry: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Railway pull URL" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
